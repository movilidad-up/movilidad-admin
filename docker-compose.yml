services:
  movilidad-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite integra estas opciones públicas de Firebase en el bundle durante el build.
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Define VITE_FIREBASE_API_KEY en el entorno}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Define VITE_FIREBASE_AUTH_DOMAIN en el entorno}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Define VITE_FIREBASE_PROJECT_ID en el entorno}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?Define VITE_FIREBASE_STORAGE_BUCKET en el entorno}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?Define VITE_FIREBASE_MESSAGING_SENDER_ID en el entorno}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Define VITE_FIREBASE_APP_ID en el entorno}
    ports:
      - "80:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - movilidad-frontend

networks:
  movilidad-frontend:
    driver: bridge
    internal: true
