name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  security-scan:
    name: SAST and SCA Analysis
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write # Requerido para subir alertas de seguridad a GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. SCA: Análisis de composición de software (Dependencias) con Trivy
      - name: Run Trivy vulnerability scanner (SCA)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Falla el build si encuentra vulnerabilidades CRITICAL o HIGH

      # 2. SAST: Análisis estático de código fuente con Semgrep
      - name: Run Semgrep Security Scan (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
          generate-sarif: 'true'
          sarif_output: 'semgrep-results.sarif'

      # 3. Subir resultados al panel de seguridad de GitHub
      - name: Upload SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
